[project]
name = "study-planner-mcp"
version = "0.1.0"
description = "MCP server scaffold for the AI student assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28,<2",
    "pydantic>=2,<3",
]

[project.scripts]
mcp-server = "src.server:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
