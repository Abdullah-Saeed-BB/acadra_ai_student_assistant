[project]
name = "study-planner-mcp"
version = "0.1.0"
description = "MCP server scaffold for the AI student assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "httpx>=0.27,<1",
    "keyring>=25,<27",
    "mcp>=1.28,<2",
    "langchain-groq>=0.3.8,<2",
    "langgraph>=0.2,<2",
    "pydantic>=2,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2,<3",
    "starlette>=1.3,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
mcp-server = "src.server:main"
api-server = "src.api.app:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
